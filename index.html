<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c4a6e" />
  <meta name="description" content="按教学周自动显示课程的个人课表。" />
  <title>我的课表</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a3a;
      --muted: #607584;
      --line: #d8e4ea;
      --paper: rgba(255, 255, 255, 0.88);
      --blue-950: #082f49;
      --blue-800: #075985;
      --blue-600: #0284c7;
      --blue-100: #e0f2fe;
      --blue-50: #f0f9ff;
      --cyan: #67e8f9;
      --coral: #fb7185;
      --shadow: 0 18px 55px rgba(8, 47, 73, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 5%, rgba(103, 232, 249, 0.24), transparent 30rem),
        radial-gradient(circle at 90% 20%, rgba(125, 211, 252, 0.24), transparent 34rem),
        #f4f8fa;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .app {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 15px;
      color: white;
      background: linear-gradient(145deg, var(--blue-600), var(--blue-950));
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.28);
    }

    .brand-mark svg { width: 24px; height: 24px; }
    h1 { margin: 0; font-size: clamp(1.35rem, 2vw, 1.7rem); letter-spacing: -0.03em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.86rem; }

    .today-button,
    .nav-button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.84);
      color: var(--blue-950);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .today-button { padding: 0 17px; font-weight: 700; }
    .nav-button { width: 44px; display: grid; place-items: center; font-size: 1.2rem; }
    .today-button:hover, .nav-button:hover { transform: translateY(-1px); border-color: #7dd3fc; box-shadow: 0 6px 18px rgba(2,132,199,.12); }
    button:focus-visible { outline: 3px solid rgba(2,132,199,.25); outline-offset: 2px; }
    button:disabled { opacity: .35; cursor: not-allowed; transform: none; box-shadow: none; }

    .summary {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 24px;
      padding: clamp(24px, 4vw, 38px);
      border-radius: 28px;
      color: white;
      background: linear-gradient(128deg, var(--blue-950), #075985 58%, #0e7490);
      box-shadow: var(--shadow);
    }

    .summary::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -80px;
      top: -160px;
      border: 54px solid rgba(255,255,255,.07);
      border-radius: 50%;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: .83rem;
      font-weight: 700;
      letter-spacing: .08em;
      color: #bae6fd;
    }

    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 5px rgba(103,232,249,.12); }
    .summary h2 { margin: 0; font-size: clamp(2rem, 5vw, 3.45rem); line-height: 1.08; letter-spacing: -.05em; }
    .summary-date { margin: 12px 0 0; color: #d8f2ff; font-size: 1rem; }

    .next-class {
      position: relative;
      z-index: 1;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px 22px;
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 20px;
      background: rgba(255,255,255,.09);
      backdrop-filter: blur(8px);
    }

    .next-class .label { font-size: .78rem; letter-spacing: .08em; color: #bae6fd; }
    .next-class strong { margin-top: 7px; font-size: 1.18rem; line-height: 1.45; }
    .next-class span:last-child { margin-top: 6px; color: #d8f2ff; font-size: .9rem; }

    .week-panel {
      margin-top: 22px;
      padding: 20px;
      border: 1px solid rgba(216,228,234,.9);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 10px 35px rgba(31, 58, 72, 0.07);
      backdrop-filter: blur(16px);
    }

    .week-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 2px 17px;
    }

    .week-title-wrap { min-width: 0; }
    .week-title { margin: 0; font-size: 1.25rem; }
    .week-range { margin: 5px 0 0; color: var(--muted); font-size: .88rem; }
    .week-nav { display: flex; gap: 8px; }

    .schedule-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      scrollbar-color: #9fc2d2 transparent;
      scrollbar-width: thin;
    }

    .week-grid {
      display: grid;
      grid-template-columns: 126px repeat(7, minmax(165px, 1fr));
      grid-template-rows: 72px repeat(4, minmax(150px, auto));
      grid-auto-flow: row;
      min-width: 1280px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: white;
    }

    .corner-cell,
    .period-header,
    .day-label,
    .schedule-cell {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .corner-cell,
    .period-header,
    .day-label {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .corner-cell {
      grid-column: 1;
      grid-row: 1;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      color: var(--muted);
      background: #f1f6f8;
      font-size: .8rem;
      font-weight: 700;
    }

    .corner-cell strong { color: var(--ink); font-size: .84rem; }
    .corner-cell span { font-size: .74rem; }

    .period-header {
      flex-direction: column;
      gap: 5px;
      padding: 9px 8px;
      background: #f1f6f8;
    }

    .period-header strong { font-size: .88rem; }
    .period-header span { color: var(--muted); font-size: .72rem; }

    .day-label {
      flex-direction: column;
      gap: 5px;
      padding: 10px 8px;
      background: #f7fafb;
    }

    .day-label.is-today {
      color: white;
      background: linear-gradient(135deg, var(--blue-800), var(--blue-600));
    }

    .day-name { font-size: .9rem; font-weight: 800; }
    .day-date { color: var(--muted); font-size: .74rem; }
    .day-label.is-today .day-date { color: #d9f4ff; }

    .schedule-cell {
      min-width: 0;
      background: rgba(249,252,253,.72);
    }

    .schedule-cell.is-today { background: #f0f9ff; }

    .course-card {
      z-index: 2;
      align-self: stretch;
      min-width: 0;
      overflow: hidden;
      margin: 7px;
      padding: 12px 10px;
      border: 1px solid color-mix(in srgb, var(--course-color) 22%, white);
      border-left: 4px solid var(--course-color, var(--blue-600));
      border-radius: 12px;
      background: color-mix(in srgb, var(--course-color) 7%, white);
      box-shadow: 0 6px 16px rgba(26, 59, 77, .08);
    }

    .course-time { color: var(--course-color, var(--blue-800)); font-size: .72rem; font-weight: 800; }
    .course-name { margin: 6px 0 8px; font-size: .86rem; line-height: 1.42; font-weight: 800; }
    .course-meta { display: flex; align-items: center; gap: 5px; margin-top: 4px; color: var(--muted); font-size: .72rem; line-height: 1.4; }
    .course-meta svg { width: 13px; height: 13px; flex: 0 0 auto; }

    .empty-state {
      grid-column: 1 / -1;
      display: none;
      text-align: center;
      padding: 14px 10px 2px;
      color: var(--muted);
      font-size: .9rem;
    }

    .footer-note { margin: 16px 2px 0; color: var(--muted); font-size: .78rem; text-align: right; }
    .scroll-hint { display: none; margin: -5px 0 12px; color: var(--muted); font-size: .78rem; }

    @media (max-width: 960px) {
      .summary { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .app { width: calc(100% - 12px); padding: 14px 0 26px; }
      .brand p { display: none; }
      .today-button { padding: 0 13px; }
      .summary { padding: 24px 21px; border-radius: 22px; }
      .next-class { padding: 17px 18px; }
      .week-panel { padding: 8px; border-radius: 16px; }
      .week-toolbar { padding: 4px 4px 12px; }
      .scroll-hint { display: none; }
      .schedule-scroll { width: 100%; margin: 0; padding: 0; overflow-x: hidden; }
      .week-grid {
        width: 100%;
        min-width: 0;
        grid-template-columns: 50px repeat(7, minmax(0, 1fr));
        grid-template-rows: 50px repeat(4, minmax(96px, auto));
        border-radius: 12px;
      }
      .corner-cell { gap: 1px; padding: 2px 1px; }
      .corner-cell strong, .corner-cell span { font-size: .68rem; }
      .day-label { gap: 2px; padding: 4px 1px; }
      .day-name { font-size: .72rem; white-space: nowrap; }
      .day-date { font-size: .66rem; }
      .period-header { gap: 2px; padding: 4px 2px; }
      .period-header strong { font-size: .72rem; line-height: 1.25; }
      .period-header span { display: none; }
      .course-card {
        margin: 2px;
        padding: 5px 3px;
        border-left-width: 2px;
        border-radius: 7px;
        text-align: center;
        box-shadow: none;
      }
      .course-time { display: none; }
      .course-name { margin: 0 0 4px; font-size: .72rem; line-height: 1.25; word-break: break-all; }
      .course-meta { justify-content: center; margin-top: 2px; font-size: .68rem; line-height: 1.2; word-break: break-all; }
      .course-meta svg { display: none; }
      .footer-note { text-align: left; line-height: 1.55; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3M8 17h3"/></svg>
        </div>
        <div>
          <h1>我的课表</h1>
          <p>葫芦岛校区 · 2026 秋季学期</p>
        </div>
      </div>
      <button class="today-button" id="todayButton" type="button">回到本周</button>
    </header>

    <section class="summary" aria-labelledby="todayTitle">
      <div>
        <div class="eyebrow" id="currentLabel">CURRENT WEEK</div>
        <h2 id="todayTitle">第 2 周 · 星期四</h2>
        <p class="summary-date" id="todayDate">2026年9月10日</p>
      </div>
      <div class="next-class" id="nextClass" aria-live="polite"></div>
    </section>

    <section class="week-panel" aria-labelledby="weekTitle">
      <div class="week-toolbar">
        <div class="week-title-wrap">
          <h3 class="week-title" id="weekTitle">第 2 周课程</h3>
          <p class="week-range" id="weekRange">9月7日 — 9月13日</p>
        </div>
        <div class="week-nav" aria-label="切换教学周">
          <button class="nav-button" id="prevWeek" type="button" aria-label="上一周">←</button>
          <button class="nav-button" id="nextWeek" type="button" aria-label="下一周">→</button>
        </div>
      </div>
      <p class="scroll-hint">星期一至星期日横向排列，第1至第4大节纵向排列；可左右滑动查看</p>
      <div class="schedule-scroll" role="region" aria-label="课表按星期分列、按节次分行" tabindex="0">
        <div class="week-grid" id="weekGrid"></div>
      </div>
      <p class="empty-state" id="emptyState">本周暂无课程，稍作休整吧。</p>
      <p class="footer-note">课表依据教务系统信息整理，临时调课请以学院通知为准。</p>
    </section>
  </main>

  <script>
    const semesterStart = new Date(2026, 7, 31); // 第1周星期一
    const semesterWeeks = 18;
    const weekNames = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
    const dateWeekNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
    const periodTimes = {
      '1-2': '08:00–09:35',
      '3-4': '09:55–11:30',
      '5-6': '14:00–15:35',
      '7-8': '15:55–17:30',
      '5-8': '14:00–17:30',
      '1-4': '08:00–11:30'
    };

    const timeBlocks = [
      { periods: '1-2', label: '第 1 大节', time: '上午 · 08:00–09:35' },
      { periods: '3-4', label: '第 2 大节', time: '上午 · 09:55–11:30' },
      { periods: '5-6', label: '第 3 大节', time: '下午 · 14:00–15:35' },
      { periods: '7-8', label: '第 4 大节', time: '下午 · 15:55–17:30' }
    ];

    const periodPlacement = {
      '1-2': { row: 2, span: 1 },
      '3-4': { row: 3, span: 1 },
      '1-4': { row: 2, span: 2 },
      '5-6': { row: 4, span: 1 },
      '7-8': { row: 5, span: 1 },
      '5-8': { row: 4, span: 2 }
    };

    const courses = [
      { name: '英语读写（博士）', teacher: '鲍春艳', room: '耘慧117', day: 1, periods: '1-2', weeks: [3,4,5,6,7,8,9,10], color: '#0284c7' },
      { name: '英语读写（博士）', teacher: '鲍春艳', room: '耘慧117', day: 3, periods: '1-2', weeks: [3,4,5,6,7,8,9,10], color: '#0284c7' },
      { name: '英语听说（博士）', teacher: 'EL MOULOUA LAILA', room: '耘慧117', day: 3, periods: '3-4', weeks: [3,4,5,6,7,8,9,10], color: '#0891b2' },
      { name: '马克思主义经典著作选读', teacher: '孙平', room: '耘慧109', day: 2, periods: '5-8', weeks: [3,4,5,6], color: '#f97316' },
      { name: '近代数学理论', teacher: '林清水', room: '耘慧117', day: 7, periods: '5-8', weeks: [3,4,5,6,7,8,9,10], color: '#7c3aed' },
      { name: '数据分析方法与应用', teacher: '刘涛', room: '耘慧317', day: 6, periods: '1-4', weeks: [11,12,13,14,15,16,17,18], color: '#059669' },
      { name: '中国马克思主义与当代', teacher: '尚航', room: '耘慧317', day: 6, periods: '5-8', weeks: [12,13,14,15], color: '#e11d48' },
      { name: '中国马克思主义与当代', teacher: '尚航', room: '耘慧317', day: 7, periods: '5-8', weeks: [12,13,14,15], color: '#e11d48' }
    ];

    const icons = {
      room: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>',
      teacher: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>'
    };

    const pad = value => String(value).padStart(2, '0');
    const dateOnly = date => new Date(date.getFullYear(), date.getMonth(), date.getDate());
    const addDays = (date, days) => { const copy = new Date(date); copy.setDate(copy.getDate() + days); return copy; };
    const teachingWeek = date => Math.floor((dateOnly(date) - semesterStart) / 604800000) + 1;
    const clampWeek = week => Math.min(semesterWeeks, Math.max(1, week));
    const formatFullDate = date => `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
    const formatShortDate = date => `${date.getMonth()+1}月${date.getDate()}日`;
    const mondayOfWeek = week => addDays(semesterStart, (week - 1) * 7);
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));

    const actualToday = new Date();
    const actualWeek = teachingWeek(actualToday);
    const initialWeek = actualWeek >= 1 && actualWeek <= semesterWeeks ? actualWeek : 2;
    let selectedWeek = initialWeek;

    function findNextClass(fromDate) {
      const candidates = [];
      courses.forEach(course => course.weeks.forEach(week => {
        const date = addDays(mondayOfWeek(week), course.day - 1);
        const [start] = periodTimes[course.periods].split('–');
        const [hour, minute] = start.split(':').map(Number);
        date.setHours(hour, minute, 0, 0);
        if (date >= fromDate) candidates.push({ ...course, date, week });
      }));
      return candidates.sort((a,b) => a.date - b.date)[0];
    }

    function renderNextClass() {
      const todayCourses = courses.filter(c => c.weeks.includes(initialWeek) && c.day === ((actualToday.getDay() + 6) % 7 + 1));
      const next = findNextClass(actualToday);
      const container = document.getElementById('nextClass');
      if (!next) {
        container.innerHTML = '<span class="label">课程状态</span><strong>本学期课程已结束</strong><span>好好休息，继续保持。</span>';
        return;
      }
      const label = todayCourses.length ? '下一节课' : '今日无课 · 下一节';
      container.innerHTML = `<span class="label">${label}</span><strong>${escapeHtml(next.name)}</strong><span>${formatShortDate(next.date)} ${dateWeekNames[next.date.getDay()]} · ${periodTimes[next.periods]} · ${escapeHtml(next.room)}</span>`;
    }

    function renderSummary() {
      const shownAsCurrent = selectedWeek === initialWeek;
      document.getElementById('currentLabel').textContent = shownAsCurrent ? 'CURRENT WEEK' : 'VIEWING WEEK';
      document.getElementById('todayTitle').textContent = shownAsCurrent
        ? `第 ${initialWeek} 周 · ${dateWeekNames[actualToday.getDay()]}`
        : `正在查看第 ${selectedWeek} 周`;
      document.getElementById('todayDate').textContent = shownAsCurrent
        ? formatFullDate(actualToday)
        : `${formatShortDate(mondayOfWeek(selectedWeek))}至${formatShortDate(addDays(mondayOfWeek(selectedWeek), 6))}`;
    }

    function courseCard(course) {
      const placement = periodPlacement[course.periods];
      return `<article class="course-card" style="--course-color:${course.color};grid-column:${course.day + 1};grid-row:${placement.row} / span ${placement.span}" aria-label="${escapeHtml(course.name)}，${weekNames[course.day - 1]}，${course.periods}节">
        <div class="course-time">${course.periods} 节 · ${periodTimes[course.periods]}</div>
        <div class="course-name">${escapeHtml(course.name)}</div>
        <div class="course-meta course-room">${icons.room}<span>${escapeHtml(course.room)}</span></div>
        <div class="course-meta course-teacher">${icons.teacher}<span>${escapeHtml(course.teacher)}</span></div>
      </article>`;
    }

    function renderWeek() {
      const start = mondayOfWeek(selectedWeek);
      const thisWeekCourses = courses.filter(course => course.weeks.includes(selectedWeek));
      document.getElementById('weekTitle').textContent = `第 ${selectedWeek} 周课程`;
      document.getElementById('weekRange').textContent = `${formatShortDate(start)} — ${formatShortDate(addDays(start, 6))}`;
      document.getElementById('prevWeek').disabled = selectedWeek === 1;
      document.getElementById('nextWeek').disabled = selectedWeek === semesterWeeks;
      document.getElementById('todayButton').disabled = selectedWeek === initialWeek;
      document.getElementById('emptyState').style.display = thisWeekCourses.length ? 'none' : 'block';

      const currentDay = (actualToday.getDay() + 6) % 7 + 1;
      const dayLabels = weekNames.map((name, index) => {
        const day = index + 1;
        const date = addDays(start, index);
        const isToday = selectedWeek === initialWeek && day === currentDay;
        return `<div class="day-label${isToday ? ' is-today' : ''}" style="grid-column:${day + 1};grid-row:1">
          <span class="day-name">${name}</span><span class="day-date">${pad(date.getMonth()+1)}.${pad(date.getDate())}</span>
        </div>`;
      }).join('');

      const periodHeaders = timeBlocks.map((block, index) => `<div class="period-header" style="grid-column:1;grid-row:${index + 2}">
        <strong>${block.label}</strong><span>${block.periods}节 · ${block.time}</span>
      </div>`).join('');

      const tableCells = weekNames.flatMap((_, dayIndex) => timeBlocks.map((__, periodIndex) => {
        const isToday = selectedWeek === initialWeek && dayIndex + 1 === currentDay;
        return `<div class="schedule-cell${isToday ? ' is-today' : ''}" style="grid-column:${dayIndex + 2};grid-row:${periodIndex + 2}" aria-hidden="true"></div>`;
      })).join('');

      document.getElementById('weekGrid').innerHTML = `
        <div class="corner-cell" aria-label="列是星期，行是节次"><strong>星期 →</strong><span>节次 ↓</span></div>
        ${periodHeaders}
        ${dayLabels}
        ${tableCells}
        ${thisWeekCourses.map(courseCard).join('')}`;

      renderSummary();
    }

    function showWeek(week) {
      if (!Number.isInteger(week) || week < 1 || week > semesterWeeks) throw new RangeError('教学周必须是 1—18 的整数');
      selectedWeek = week;
      renderWeek();
      return { week: selectedWeek, range: document.getElementById('weekRange').textContent };
    }

    document.getElementById('prevWeek').addEventListener('click', () => showWeek(clampWeek(selectedWeek - 1)));
    document.getElementById('nextWeek').addEventListener('click', () => showWeek(clampWeek(selectedWeek + 1)));
    document.getElementById('todayButton').addEventListener('click', () => showWeek(initialWeek));
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') showWeek(clampWeek(selectedWeek - 1));
      if (event.key === 'ArrowRight') showWeek(clampWeek(selectedWeek + 1));
    });

    renderNextClass();
    renderWeek();

    if (document.modelContext?.registerTool) {
      const lifecycle = new AbortController();
      try {
        void Promise.resolve(document.modelContext.registerTool({
          name: 'show_teaching_week',
          title: '查看教学周',
          description: '切换页面并显示指定教学周的课表。',
          inputSchema: {
            type: 'object',
            properties: { week: { type: 'integer', minimum: 1, maximum: 18 } },
            required: ['week'],
            additionalProperties: false
          },
          annotations: { readOnlyHint: false, untrustedContentHint: false },
          execute(input) {
            if (!input || !Number.isInteger(input.week)) throw new TypeError('week 必须是整数');
            return showWeek(input.week);
          }
        }, { signal: lifecycle.signal })).catch(() => {});
      } catch (_) {}
    }
  </script>
</body>
</html>
